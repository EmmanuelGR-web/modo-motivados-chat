<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05010f">
  <meta name="color-scheme" content="dark light">
  <title>Panel de expositores · Modo Motivados</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👑%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>

  <!-- VERIFICANDO SESIÓN (sin sesión válida se vuelve al ingreso único en "/") -->
  <main id="screen-login" class="screen">
    <img class="logo sm" src="/logo.png" alt="Modo Motivados Stream">
    <div class="card state-card">
      <div class="big pulse">⚡</div>
      <p class="lead">Verificando acceso…</p>
    </div>
    <footer class="site-footer">
      <div class="sf-logos">
        <img src="/brand/neoematech.webp" alt="NeoEmaTech" width="126" height="36" loading="lazy">
        <img src="/brand/eb-tech.webp" alt="EB Tech" width="56" height="36" loading="lazy">
      </div>
      <small>© 2026 NeoEmaTech · Todos los derechos reservados</small>
    </footer>
  </main>

  <!-- PANEL -->
  <div id="admin" class="admin hidden">
    <header class="admin-top">
      <div class="brand">
        <b class="neon-text" id="a-title">Modo Motivados</b>
        <small><span id="a-pill" class="pill waiting">En espera</span><span id="a-online"></span></small>
      </div>
      <div class="ctrl" id="ctrl"></div>
      <div id="a-timer" class="timer hidden">00:00</div>
      <button type="button" class="icon-btn" id="a-theme" data-theme-toggle>🌙</button>
      <button id="a-logout" class="icon-btn" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">🚪</button>
    </header>

    <div class="admin-sub">
      <button id="a-share" class="btn btn-sm btn-primary" type="button">📤 Compartir</button>
      <label class="switch" title="Si está activado, cada oyente espera tu aprobación para entrar">
        <input type="checkbox" id="a-approval"> <span>Pedir aprobación<span class="hide-sm"> para entrar</span></span>
      </label>
      <label class="switch" title="Sonido de los mensajes del chat y de los avisos de solicitudes">
        <input type="checkbox" id="a-sound"> <span id="a-sound-lbl"><span id="a-sound-ico">🔔</span> Sonido<span class="hide-sm"> del chat</span></span>
      </label>
      <div class="sub-actions">
        <button id="a-clear" class="btn btn-sm btn-ghost" type="button" title="Limpiar chat">🧹 Limpiar<span class="hide-sm"> chat</span></button>
        <button id="a-rename" class="btn btn-sm btn-ghost" type="button" title="Cambiar título">✏️ <span class="hide-sm">Cambiar título</span><span class="show-sm">Título</span></button>
      </div>
    </div>

    <div class="admin-main">
      <section class="panel" id="panel-users">
        <div class="seg" id="seg">
          <button data-tab="active" class="on" type="button">En sala <span class="cnt" id="c-active">0</span></button>
          <button data-tab="pending" type="button">Solicitudes <span class="cnt" id="c-pending">0</span></button>
          <button data-tab="banned" type="button">Baneados <span class="cnt" id="c-banned">0</span></button>
        </div>
        <div class="list-tools" id="list-tools"></div>
        <div class="admin-list" id="a-list"></div>
        <footer class="site-footer compact">
      <div class="sf-logos">
        <img src="/brand/neoematech.webp" alt="NeoEmaTech" width="126" height="36" loading="lazy">
        <img src="/brand/eb-tech.webp" alt="EB Tech" width="56" height="36" loading="lazy">
      </div>
      <small>© 2026 NeoEmaTech · Todos los derechos reservados</small>
    </footer>
      </section>

      <section class="panel" id="panel-chat">
        <nav id="a-tabs" class="tabs hidden" aria-label="Conversaciones"></nav>
        <div id="a-banner" class="banner info hidden"></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div id="picker-slot"></div>
        <form id="composer" class="composer" autocomplete="off">
          <button type="button" id="btn-emoji" class="icon-btn" aria-label="Emojis y stickers">😊</button>
          <input id="input" class="field" maxlength="500" placeholder="Escribir como expositor…" aria-label="Mensaje">
          <button class="send" type="submit" aria-label="Enviar">➤</button>
        </form>
      </section>
    </div>

    <nav class="bottom-nav" id="bottom-nav">
      <button data-p="panel-chat" class="on" type="button">💬 Chat <span class="badge hidden" id="nav-chat-badge" style="top:4px;right:18%">0</span></button>
      <button data-p="panel-users" type="button">👥 Oyentes <span class="badge hidden" id="nav-badge" style="top:4px;right:18%">0</span></button>
    </nav>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
